<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>全螢幕智慧語音課表</title>
<style>
    :root {
        --primary-bg: #fdfbf7;
        --header-bg: #4a90e2;
        --header-text: #ffffff;
        --border-color: #e0e0e0;
        --hover-color: #fff8e1;
        --highlight-bg: #fffbe6;
        --highlight-header: #f5a623;
        --highlight-border: #f5a623;
    }

    /* 2. 全局設定：絕對鎖死畫面，禁用所有預設觸控手勢 */
    html, body {
        position: fixed; /* 將畫面釘死，防止手機瀏覽器的彈性拖拉回饋 */
        top: 0; left: 0; right: 0; bottom: 0;
        width: 100vw;
        height: 100dvh; /* 使用 dvh (動態視口)，完美避開手機網址列的干擾 */
        margin: 0;
        padding: 0;
        overflow: hidden; /* 完全隱藏捲軸 */
        font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
        background-color: #f4f4f4;
        
        touch-action: none; /* 禁用瀏覽器預設的滑動、雙指縮放等手勢 */
        -webkit-user-select: none; /* iOS 禁用長按反白選取文字 */
        user-select: none; /* 一般瀏覽器禁用選取文字 */
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1dvh 1vw; /* 邊距也改用 dvh */
        box-sizing: border-box;
    }

    /* 主佈局 */
    .main-layout {
        display: flex;
        gap: 1vw;
        width: 100%;
        height: 98dvh; /* 使用 dvh 確保高度精準 */
        max-width: 100%;
    }

    /* --- 以下樣式維持原樣不變 --- */

    /* --- 左側課表區域 --- */
    .schedule-container {
        flex: 3.5;
        background-color: var(--primary-bg);
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .schedule-header {
        background-color: var(--header-bg);
        color: var(--header-text);
        padding: 1dvh;
        text-align: center;
        flex-shrink: 0;
    }

    .schedule-header h1 { margin: 0; font-size: 2.5dvh; }

    table {
        width: 100%;
        height: 100%;
        border-collapse: collapse;
        text-align: center;
        table-layout: fixed;
    }

    th, td {
        border-bottom: 3px solid var(--border-color);
        border-right: 1px solid var(--border-color);
        font-size: 2.9dvh;
        vertical-align: middle;
        word-wrap: break-word;
        padding: 0px;
        cursor: pointer;
    }
    
    tr { height: 10%; } 
    th:first-child { width: 3%; }
    th:nth-child(2) { width: 8%; }

    thead th {
        background-color: #f8f9fa;
        color: #555;
        font-weight: bold;
        height: 6%;
    }

    .period-col { font-weight: bold; color: #4a90e2; background-color: #fafafa; }
    .time-col { font-size: 1.5dvh; color: #888; background-color: #fafafa; }
    
    td:active { background-color: #ffe082 !important; transform: scale(0.98); }
    th.current-day { background-color: var(--highlight-header) !important; color: white !important; }
    td.current-day { background-color: var(--highlight-bg) !important; font-weight: bold; color: #333; }

    /* --- 右側資訊欄 --- */
    .sidebar {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.1dvh;
        height: 100%;
    }

    .widget {
        background: white;
        border-radius: 12px;
        padding: 1dvh;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        box-sizing: border-box;
    }

    .calendar-widget { flex: 0.8; justify-content: space-evenly; }
    .dynalist-widget { flex: 2.8; padding: 0dvh; } 
    .music-widget { flex: 1.2; }

    /* 日曆與時鐘整合區塊樣式 */
    .cal-header-row {
        display: flex;
        align-items: center;
        justify-content: space-around;
        width: 100%;
    }
    .cal-info {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .cal-month { font-size: 1.8dvh; color: #888; }
    .cal-date { font-size: 4.5dvh; font-weight: bold; color: #333; line-height: 1; margin: 0.5dvh 0; }
    .cal-day { font-size: 2dvh; color: var(--header-bg); font-weight: bold; background: #eef6ff; padding: 0.4dvh 1.5dvh; border-radius: 20px;}

    .digital-clock {
        font-family: 'Courier New', Courier, monospace;
        font-size: 3.5dvh;
        font-weight: bold;
        color: #333;
        background: #f0f0f0;
        padding: 0.8dvh 1.5dvh;
        border-radius: 8px;
    }

    .clock-face {
        width: 13dvh;
        height: 13dvh;
        border: 0.4dvh solid #333;
        border-radius: 50%;
        position: relative;
        background: white;
        flex-shrink: 0;
        margin-top: 0.5dvh;
    }
    .clock-number {
        position: absolute; 
        width: 100%; 
        height: 100%; 
        text-align: center; 
        font-weight: bold; 
        font-size: 1.8dvh; 
        color: #333;
        top: 0;
        left: 0;
        padding-top: 0.2dvh; 
        box-sizing: border-box;
    }
    .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: #333; transform: translateX(-50%); z-index: 2; border-radius: 4px;}
    .hour-hand { width: 0.6dvh; height: 25%; }
    .min-hand { width: 0.4dvh; height: 35%; background: #666; }
    .sec-hand { width: 0.2dvh; height: 42%; background: red; z-index: 3;}
    .center-dot { width: 1.2dvh; height: 1.2dvh; background: #333; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 4; position: absolute;}

    .dynalist-widget iframe { width: 100%; height: 100%; border-radius: 2px; border: none; }
    .music-widget iframe { width: 100%; height: 100%; border-radius: 8px; border: none; }

    /* --- 變暗遮罩與按鈕樣式 --- */
    .dimmer-btn {
        position: fixed;
        bottom: 2dvh;
        right: 2dvh;
        width: 6dvh;
        height: 6dvh;
        border-radius: 50%;
        background-color: #333;
        color: white;
        border: none;
        font-size: 3dvh;
        cursor: pointer;
        z-index: 10000; 
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
    }
    .dimmer-btn:hover { transform: scale(1.1); }

    #dimmer-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.95); 
        z-index: 9999; 
        opacity: 0; 
        pointer-events: none; 
        transition: opacity 0.5s ease;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #555;
        font-size: 3dvh;
    }
    
    #dimmer-overlay.active {
        opacity: 1;
        pointer-events: all; 
    }

    /* --- 菜單按鈕與彈窗樣式 --- */
    .menu-btn-group {
        display: inline-block;
        margin-left: 3dvh;
    }
    .menu-btn {
        background-color: #fff;
        color: var(--header-bg);
        border: 2px solid var(--header-bg);
        padding: 0.5dvh 1.5dvh;
        border-radius: 20px;
        font-size: 2dvh;
        font-weight: bold;
        cursor: pointer;
        margin: 0 0.5dvh;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        transition: all 0.2s;
    }
    .menu-btn:hover {
        background-color: var(--header-bg);
        color: white;
    }
    .menu-btn:active {
        transform: scale(0.95);
    }

    .modal-overlay {
        display: none; 
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 10001; 
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(3px);
    }
    
    .modal-content {
        background: white;
        width: 85vw;
        height: 85dvh;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        animation: modalFadeIn 0.3s ease-out;
    }

    @keyframes modalFadeIn {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .modal-header {
        background-color: var(--highlight-header);
        color: white;
        padding: 1.5dvh 2vw;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 2.5dvh;
        font-weight: bold;
    }

    .close-btn {
        cursor: pointer;
        font-size: 4dvh;
        line-height: 1;
    }
    .close-btn:hover { color: #ffe082; }

    .modal-body {
        flex: 1;
        padding: 0;
        background: #f9f9f9;
    }
    
    .modal-body iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
</style>
</head>
